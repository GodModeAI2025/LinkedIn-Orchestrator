name: Release

on:
  push:
    tags:
      - 'v*'
  # Handstart, wenn kein Tag gepusht werden kann oder ein Release wiederholt
  # werden muss. Die Version kommt auch dann aus VERSION und nicht aus einer
  # Eingabe: es gibt eine Quelle, und das bleibt so.
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Wie in der CI stehen die Actions auf Tags, nicht auf Commit-SHAs.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Beim Tag-Lauf muss der Tagname zu VERSION passen, sonst verspricht der
      # Tagname eine Version, die im Repo nirgends steht. Beim Handstart gibt es
      # keinen Tagnamen; dann gilt VERSION, und der Tag wird daraus gesetzt.
      - name: Version bestimmen und pruefen
        id: version
        run: |
          version="$(cat VERSION)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          python scripts/check_versions.py --expect "$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "nummer=$version" >> "$GITHUB_OUTPUT"

      # Dieses Repo liefert kein Archiv aus: der Skill wird als Plugin
      # installiert oder geklont. Das Release ist die Markierung des Stands und
      # traegt den zugehoerigen Abschnitt aus CHANGELOG.md als Text.
      - name: Release-Text aus CHANGELOG.md schneiden
        id: text
        run: |
          python - "${{ steps.version.outputs.nummer }}" <<'PY' > release-notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          treffer = re.search(
              r"^## %s .*?\n(.*?)(?=^## \d|\Z)" % re.escape(version),
              text, re.S | re.M)
          if not treffer:
              sys.exit("FEHLER: CHANGELOG.md hat keinen Abschnitt fuer %s" % version)
          print(treffer.group(1).strip())
          PY
          cat release-notes.md

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
